<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="description" content="日文學習：單元、練習與錯題本。可離線使用。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="日文日誌">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'">
  <title>日文日誌</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="frame">
    <header class="top">
      <div class="brand-row">
        <img class="mascot-face" src="assets/mascot/cat-face.png" alt="" width="48" height="48" data-fallback="face">
        <div>
          <p class="brand">日文日誌</p>
          <p class="tagline" id="tagline">每日約十分鐘</p>
        </div>
      </div>
    </header>
    <div id="speech-hint" class="banner speech-hint" role="status" hidden></div>
    <main id="app">
      <p class="boot">載入中……</p>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="主要">
      <a href="#/" data-tab="learn">
        <img src="assets/tabs/tab-study-inactive.png" data-active="assets/tabs/tab-study-active.png" data-inactive="assets/tabs/tab-study-inactive.png" alt="" width="28" height="28">
        <span>學習</span>
      </a>
      <a href="#/review" data-tab="review">
        <img src="assets/tabs/tab-review-inactive.png" data-active="assets/tabs/tab-review-active.png" data-inactive="assets/tabs/tab-review-inactive.png" alt="" width="28" height="28">
        <span>複習</span>
      </a>
      <a href="#/me" data-tab="me">
        <img src="assets/tabs/tab-me-inactive.png" data-active="assets/tabs/tab-me-active.png" data-inactive="assets/tabs/tab-me-inactive.png" alt="" width="28" height="28">
        <span>我的</span>
      </a>
    </nav>
  </div>
  <script src="js/logic.js"></script>
  <script src="js/store.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
